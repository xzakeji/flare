<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<title>临时邮箱 | XZ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#111;color:#fff;padding:24px;max-width:900px;margin:0 auto}
.logo{font-size:48px;font-weight:bold;margin-bottom:24px}
.box{background:#222;border-radius:12px;padding:20px;margin-bottom:16px}
.email-row{display:flex;gap:8px;flex-wrap:wrap}
#mail-address{flex:1;padding:10px;border-radius:6px;border:none;font-size:16px}
button{padding:10px 16px;border:none;border-radius:6px;background:#fff;color:#111;font-weight:bold;cursor:pointer}
#inbox{margin-top:20px}
.mail-item{background:#333;padding:14px;border-radius:8px;margin-bottom:8px;cursor:pointer}
.mail-item:hover{background:#444}
.mail-content{margin-top:12px;padding:16px;background:#2a2a2a;border-radius:8px;white-space:pre-wrap;display:none}
.tip{color:#aaa;margin:12px 0;font-size:14px}
</style>
</head>
<body>
<div class="logo">XZ™ 临时邮箱</div>
<div class="box">
    <p class="tip">临时邮箱，用于接收验证码，请勿接收重要邮件</p>
    <div class="email-row">
        <input id="mail-address" readonly placeholder="正在生成邮箱...">
        <button id="copy-btn">复制地址</button>
        <button id="refresh-btn">刷新收件箱</button>
    </div>
</div>
<div class="box" id="inbox">
    <h3>📥 收件箱</h3>
    <div id="mail-list"></div>
</div>

<script>
let account = null;
let token = "";
const API = "https://api.mail.tm";

// 创建账号
async function createMail() {
    try {
        // 获取可用域名
        const domainRes = await fetch(`${API}/domains`);
        const domainData = await domainRes.json();
        const domain = domainData["hydra:member"][0].domain;
        // 随机用户名
        const username = Math.random().toString(36).slice(2,10);
        const email = `${username}@${domain}`;
        const password = Math.random().toString(36).slice(2,12);
        // 注册邮箱
        const registerRes = await fetch(`${API}/accounts`, {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({address:email,password:password})
        });
        account = await registerRes.json();
        // 获取token
        const loginRes = await fetch(`${API}/token`, {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({address:email,password:password})
        });
        const loginData = await loginRes.json();
        token = loginData.token;
        document.getElementById("mail-address").value = email;
        loadInbox();
    } catch (e) {
        document.getElementById("mail-list").innerHTML = "<p>生成失败！接口无法访问</p>";
    }
}

// 读取收件箱
async function loadInbox() {
    const listDom = document.getElementById("mail-list");
    if(!token) return;
    listDom.innerHTML = "<p>加载中...</p>";
    try {
        const res = await fetch(`${API}/messages`, {
            headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        const mails = data["hydra:member"];
        if(mails.length === 0){
            listDom.innerHTML = "<p class='tip'>暂无邮件，等待他人发送</p>";
            return;
        }
        listDom.innerHTML = "";
        for(let mail of mails){
            const item = document.createElement("div");
            item.className = "mail-item";
            item.innerHTML = `
                <div>发件人：${mail.from.address}</div>
                <div>标题：${mail.subject || "无标题"}</div>
                <div class="mail-content" data-id="${mail.id}">加载正文...</div>
            `;
            item.onclick = async ()=>{
                const contentDom = item.querySelector(".mail-content");
                if(contentDom.style.display === "block"){
                    contentDom.style.display = "none";
                    return;
                }
                const detailRes = await fetch(`${API}/messages/${mail.id}`,{
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const detail = await detailRes.json();
                contentDom.innerText = detail.text || "无文本内容";
                contentDom.style.display = "block";
            }
            listDom.appendChild(item);
        }
    }catch(e){
        listDom.innerHTML = "<p>读取收件箱失败</p>";
    }
}

// 复制邮箱
document.getElementById("copy-btn").onclick = ()=>{
    const val = document.getElementById("mail-address").value;
    navigator.clipboard.writeText(val).then(()=>alert("复制成功"));
}
// 刷新收件箱
document.getElementById("refresh-btn").onclick = loadInbox;

createMail();
// 30秒自动刷新
setInterval(loadInbox,30000);
</script>
</body>
</html>
